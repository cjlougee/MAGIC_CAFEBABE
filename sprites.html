<!doctype html>
<!--
  Sprite review harness — the filmstrip's companion.

  `filmstrip.html` samples an *animation* across time so the whole motion can be judged as
  one still. A building sprite has no time axis, but it does have a rotation axis and a
  footprint, and both are just as impossible to review by squinting at the game at play
  zoom: the thing that goes wrong is a few pixels of overhang past the tile diamond, and
  at 1x on a busy map that reads as nothing at all.

  So: every structure, every rotation, drawn over an outline of the footprint cells it
  claims. Art that escapes its footprint is then obvious rather than subtle, which is the
  whole point.

  Delete when buildings stop being drawn procedurally, which is to say never.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Building sprites</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #3b4a52;
        color: #dfe6ee;
        font: 12px ui-monospace, monospace;
      }
      h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; margin: 18px 0 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
      .cell { text-align: center; }
      .cell canvas { display: block; image-rendering: pixelated; }
      .label { margin-top: 4px; opacity: 0.75; }
      .controls { display: flex; gap: 14px; align-items: center; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div class="controls">
      <label><input type="checkbox" id="grid" checked /> footprint outline</label>
      <label><input type="checkbox" id="night" /> night wash</label>
      <span id="status">rendering…</span>
    </div>
    <div id="sheets"></div>

    <script type="module">
      import { Application, Container, Graphics, Rectangle } from 'pixi.js';
      import { BUILDING_DEFS } from '/src/sim/defs/buildings.ts';
      import { sizeOf } from '/src/sim/world/footprint.ts';
      import { buildBuildingGraphics, BUILDING_HEIGHT } from '/src/render/art/buildingArt.ts';
      import {
        buildPawnGraphics,
        buildSleepingPawnGraphics,
        PAWN_ASLEEP_H,
        PAWN_ASLEEP_W,
        PAWN_H,
        PAWN_W,
      } from '/src/render/art/pawnArt.ts';
      import { footprintBounds } from '/src/render/iso.ts';
      import { HALF_TILE_H, HALF_TILE_W } from '/src/render/constants.ts';

      const SCALE = 3;
      const PAD = 6;

      const app = new Application();
      await app.init({ width: 1, height: 1, backgroundAlpha: 0, antialias: false });

      /** The diamond outline of one footprint cell, in the frame's own pixel space. */
      function outlineCells(size, rise) {
        const g = new Graphics();
        for (let dy = 0; dy < size.h; dy++) {
          for (let dx = 0; dx < size.w; dx++) {
            const cx = (dx - dy + size.h) * HALF_TILE_W;
            const cy = (dx + dy + 1) * HALF_TILE_H + rise;
            g.poly([
              cx, cy - HALF_TILE_H,
              cx + HALF_TILE_W, cy,
              cx, cy + HALF_TILE_H,
              cx - HALF_TILE_W, cy,
            ]).stroke({ width: 1, color: 0x7fe3d4, alpha: 0.5 });
          }
        }
        return g;
      }

      async function draw(def, rotation, showGrid, locked = false) {
        const size = sizeOf(def.footprint, rotation);
        const rise = BUILDING_HEIGHT[def.id];
        const box = footprintBounds(0, 0, size.w, size.h, 0, rise);

        const stage = new Container();
        if (showGrid) stage.addChild(outlineCells(size, rise));
        stage.addChild(buildBuildingGraphics(def.id, rotation, def.lockable && locked));

        const canvas = app.renderer.extract.canvas({
          target: stage,
          // Stated rather than inferred, exactly as ArtProvider does it — otherwise the
          // extract crops to the ink and the overhang this page exists to reveal is
          // silently trimmed away.
          frame: new Rectangle(0, 0, box.width, box.height),
        });

        const shown = document.createElement('canvas');
        shown.width = box.width * SCALE + PAD * 2;
        shown.height = box.height * SCALE + PAD * 2;
        const ctx = shown.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(0, 0, shown.width, shown.height);
        ctx.drawImage(canvas, PAD, PAD, box.width * SCALE, box.height * SCALE);

        if (document.getElementById('night').checked) {
          ctx.globalCompositeOperation = 'multiply';
          ctx.fillStyle = '#3d4a75';
          ctx.fillRect(0, 0, shown.width, shown.height);
        }
        return shown;
      }

      async function render() {
        const showGrid = document.getElementById('grid').checked;
        const sheets = document.getElementById('sheets');
        sheets.replaceChildren();

        for (const def of BUILDING_DEFS) {
          const heading = document.createElement('h1');
          const { w, h } = def.footprint;
          heading.textContent = `${def.name} — ${w}x${h}, rises ${BUILDING_HEIGHT[def.id]}px`;
          const row = document.createElement('div');
          row.className = 'row';

          // Rotations 0 and 2 share cells and differ only in facing, so all four are
          // shown: the pair that looks identical is the bug, not the pair that doesn't.
          // A lockable structure is two pictures, so both are shown — a lock the player
          // cannot see is a setting they have to remember, which is the whole failure
          // this milestone is about.
          const states = def.lockable ? [false, true] : [false];
          for (const locked of states) {
            for (const rotation of [0, 1, 2, 3]) {
              const cell = document.createElement('div');
              cell.className = 'cell';
              cell.append(await draw(def, rotation, showGrid, locked));
              const label = document.createElement('div');
              label.className = 'label';
              label.textContent = `rot ${rotation}${locked ? ' · locked' : ''}`;
              cell.append(label);
              row.append(cell);
            }
          }

          sheets.append(heading, row);
        }
        await renderPawns(sheets);
        document.getElementById('status').textContent = `${BUILDING_DEFS.length} structures`;
      }

      /** A stand-in colonist. Any appearance will do — the pose is what is under review. */
      const WHO = { skinTone: 1, hairStyle: 2, hairColour: 0, apparelColour: 3 };

      async function shot(graphics, w, h) {
        const canvas = app.renderer.extract.canvas({
          target: graphics,
          frame: new Rectangle(0, 0, w, h),
        });
        const shown = document.createElement('canvas');
        shown.width = w * SCALE + PAD * 2;
        shown.height = h * SCALE + PAD * 2;
        const ctx = shown.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(0, 0, shown.width, shown.height);
        ctx.drawImage(canvas, PAD, PAD, w * SCALE, h * SCALE);
        return shown;
      }

      /**
       * The sleeping pose, which is the same kind of problem as a footprint: it runs along
       * an isometric axis, it has a head end, and at play zoom it is twenty pixels of
       * blanket you cannot judge.
       */
      async function renderPawns(sheets) {
        const heading = document.createElement('h1');
        heading.textContent = 'Colonist — standing, then asleep at each bed rotation';
        const row = document.createElement('div');
        row.className = 'row';

        const standing = document.createElement('div');
        standing.className = 'cell';
        standing.append(await shot(buildPawnGraphics(WHO), PAWN_W, PAWN_H));
        const stood = document.createElement('div');
        stood.className = 'label';
        stood.textContent = 'awake';
        standing.append(stood);
        row.append(standing);

        for (const rotation of [0, 1, 2, 3]) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.append(await shot(buildSleepingPawnGraphics(WHO, rotation), PAWN_ASLEEP_W, PAWN_ASLEEP_H));
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = `asleep, bed rot ${rotation}`;
          cell.append(label);
          row.append(cell);
        }

        sheets.append(heading, row);
      }

      document.getElementById('grid').addEventListener('change', render);
      document.getElementById('night').addEventListener('change', render);
      await render();
    </script>
  </body>
</html>
