<!doctype html>
<!--
  Sprite review harness — the human-facing surface of the M12 pipeline.

  Three surfaces read one manifest. `tests/art.test.ts` asserts against it, `npm run art`
  bakes it to `art/contact-sheet.png`, and this page renders it live. Before the manifest
  existed this file listed the sprites itself, which is why the sleeping pose reached it
  two milestones after the buildings did — adding art and adding it *to the review page*
  were separate acts, and the second was the one you could forget.

  Prefer `npm run art` when you want a still to look at or link to: one command, no server.
  Reach for this page when you want the things it has and a PNG cannot — live reload while
  you edit, the night wash, and zoom.

  Delete when buildings stop being drawn procedurally, which is to say never.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sprites</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #243038;
        color: #dfe6ee;
        font: 12px ui-monospace, monospace;
      }
      h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; margin: 18px 0 8px; }
      h1 span { opacity: 0.5; font-weight: 400; margin-left: 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
      .cell { text-align: center; background: #1b242a; padding: 8px; }
      .cell canvas { display: block; image-rendering: pixelated; }
      .label { margin-top: 4px; opacity: 0.75; }
      .bad { color: #d9544f; opacity: 1; }
      .controls {
        display: flex; gap: 14px; align-items: center; margin-bottom: 4px;
        position: sticky; top: 0; background: #243038; padding: 6px 0; z-index: 1;
      }
      #status { opacity: 0.6; }
    </style>
  </head>
  <body>
    <div class="controls">
      <label><input type="checkbox" id="grid" checked /> footprint outline</label>
      <label><input type="checkbox" id="night" /> night wash</label>
      <label>zoom <input type="range" id="zoom" min="1" max="8" value="3" /></label>
      <span id="status">rendering…</span>
    </div>
    <div id="sheets"></div>

    <script type="module">
      import { spriteManifest } from '/src/render/art/manifest.ts';
      import { rasterize } from '/src/render/art/raster/raster.ts';
      import { footprintGround } from '/src/render/art/raster/footprintMask.ts';
      import { visibleCounts } from '/src/render/art/raster/measure.ts';

      const manifest = spriteManifest();

      /**
       * The sprite, at scale, over an outline of the cells it claims.
       *
       * Rasterized by the same code the tests and the bake use — not re-rendered through
       * Pixi. A review surface that draws the sprite a second way can disagree with the
       * one that ships, and then it is a picture of something nobody has.
       */
      function draw(sprite, scale, showGrid, night) {
        const { width, height } = sprite;
        const raster = rasterize(sprite.draw(), width, height);

        const src = document.createElement('canvas');
        src.width = width;
        src.height = height;
        const sctx = src.getContext('2d');

        if (showGrid && sprite.footprint) {
          const ground = footprintGround(width, height, sprite.footprint.w, sprite.footprint.h, sprite.rise);
          const outline = sctx.createImageData(width, height);
          for (let i = 0; i < ground.length; i++) {
            if (!ground[i]) continue;
            const x = i % width;
            const y = (i / width) | 0;
            const edge =
              x === 0 || y === 0 || x === width - 1 || y === height - 1 ||
              !ground[i - 1] || !ground[i + 1] || !ground[i - width] || !ground[i + width];
            if (!edge) continue;
            outline.data[i * 4] = 0x53;
            outline.data[i * 4 + 1] = 0xd6;
            outline.data[i * 4 + 2] = 0xc4;
            outline.data[i * 4 + 3] = 200;
          }
          sctx.putImageData(outline, 0, 0);
        }

        // The sprite composited over the outline, so overhang reads as ink past the edge.
        const layer = document.createElement('canvas');
        layer.width = width;
        layer.height = height;
        layer.getContext('2d').putImageData(new ImageData(raster.rgba, width, height), 0, 0);
        sctx.drawImage(layer, 0, 0);

        const shown = document.createElement('canvas');
        shown.width = width * scale;
        shown.height = height * scale;
        const ctx = shown.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(src, 0, 0, shown.width, shown.height);

        if (night) {
          ctx.globalCompositeOperation = 'multiply';
          ctx.fillStyle = '#3d4a75';
          ctx.fillRect(0, 0, shown.width, shown.height);
        }
        return { canvas: shown, raster };
      }

      function render() {
        const scale = +document.getElementById('zoom').value;
        const showGrid = document.getElementById('grid').checked;
        const night = document.getElementById('night').checked;
        const sheets = document.getElementById('sheets');
        sheets.replaceChildren();

        for (const group of [...new Set(manifest.map((s) => s.group))]) {
          const entries = manifest.filter((s) => s.group === group);
          const first = entries[0];
          const size = first.footprint ? `${first.footprint.w}×${first.footprint.h}` : 'free';

          const heading = document.createElement('h1');
          heading.textContent = group;
          const meta = document.createElement('span');
          meta.textContent = `${size} · rises ${first.rise}px`;
          heading.append(meta);

          const row = document.createElement('div');
          row.className = 'row';

          for (const sprite of entries) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const { canvas, raster } = draw(sprite, scale, showGrid, night);
            cell.append(canvas);

            const label = document.createElement('div');
            label.className = 'label';
            // The same count the harness fails on, shown next to the picture — so a mark
            // nobody can see is visible *here*, where the fixing happens.
            const list = sprite.draw();
            const hidden = visibleCounts(raster, list.length)
              .filter((c) => c < sprite.contract.minVisibleInk).length;
            const declared = sprite.contract.mayHide?.count ?? 0;
            label.textContent = sprite.label + (hidden !== declared ? `  ${hidden}/${declared} hidden` : '');
            if (hidden !== declared) label.classList.add('bad');
            cell.append(label);
            row.append(cell);
          }

          sheets.append(heading, row);
        }

        document.getElementById('status').textContent =
          `${manifest.length} sprites · npm run art for a still`;
      }

      for (const id of ['grid', 'night', 'zoom']) {
        document.getElementById(id).addEventListener('input', render);
      }
      render();
    </script>
  </body>
</html>
